<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f1">
  <title>Lasses ønskeliste</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="?view=creator"><span class="brand-mark">♡</span> Ønskeliste</a>
    <span id="top-note">En lille samling af ønsker</span>
  </header>
  <main id="app"></main>

  <dialog id="wish-dialog">
    <form id="wish-form" method="dialog">
      <div class="dialog-header">
        <div>
          <h2 id="dialog-title">Tilføj et ønske</h2>
          <p>Et link er nok — resten kan tilføjes senere.</p>
        </div>
        <button type="button" class="close-button" aria-label="Luk">×</button>
      </div>
      <label class="field">
        <span>Hvad ønsker du dig?</span>
        <input name="title" required maxlength="120" placeholder="Fx en god kaffekværn">
      </label>
      <label class="field">
        <span>Link til butikken</span>
        <input name="url" type="url" placeholder="https://">
      </label>
      <label class="field">
        <span>Billede (valgfrit)</span>
        <input name="image" type="url" placeholder="https://">
      </label>
      <label class="field">
        <span>Detaljer</span>
        <textarea name="description" maxlength="240" rows="3" placeholder="Størrelse, farve eller andre detaljer"></textarea>
      </label>
      <label class="field">
        <span>Pris (valgfrit)</span>
        <input name="price" maxlength="60" placeholder="Ca. 300 kr.">
      </label>
      <div class="dialog-actions">
        <button class="button button-light cancel-button" type="button">Annuller</button>
        <button class="button button-primary" type="submit">Gem ønske</button>
      </div>
    </form>
  </dialog>
  <dialog id="confirm-dialog">
    <form method="dialog">
      <p>Vil du slette ønsket fra listen?</p>
      <div class="dialog-actions">
        <button class="button button-light" value="cancel">Annuller</button>
        <button class="button button-danger" value="delete">Slet ønske</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="wishlist-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
